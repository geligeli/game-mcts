# takumi.games -> 213.144.133.160.
# The risk2 tournament of geli-5090-linux (192.168.1.225), open to the
# internet on purpose, all of it read-only:
#   /           the start page             (/fast/web/takumi.games/index.html)
#   /ladder     the arena dashboard        (problem_server, :8090; GET only)
#   /play/      the 3D play site           (game-mcts web/serve.py, :8095)
#   /sessions/  the agents' transcripts    (game-mcts tools/agent_logs.py, :8096;
#               redacts the containers' tokens)
# The dashboard hard-codes root paths (/jobs, /games, /assets, /api, ...), so
# whatever nothing else claims is its; only its "/" moves, to /ladder.
# Certificate: Let's Encrypt via certbot (webroot), renewed by certbot.timer,
# nginx reloaded by /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh

server {
	listen 80;
	listen [::]:80;
	server_name takumi.games;

	# Let's Encrypt HTTP-01 challenges (certbot --webroot -w /var/www/letsencrypt)
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/letsencrypt;
		default_type text/plain;
	}

	location / {
		return 301 https://takumi.games$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name takumi.games;

	ssl_certificate     /etc/letsencrypt/live/takumi.games/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/takumi.games/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:takumi_games_tls:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	# Neither backend compresses or keeps connections alive; nginx does both
	# toward the browser. Game replays are ~150 KB of HTML each.
	gzip on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_types text/css application/javascript text/javascript application/json
	           application/x-ndjson image/svg+xml text/plain;

	proxy_http_version 1.1;
	proxy_set_header Host              $http_host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	# The viewer reads every transcript per request; a slow agent page is not an error.
	proxy_read_timeout 120;

	location = / {
		root /fast/web/takumi.games;
		try_files /index.html =404;
	}

	location = /ladder {
		proxy_pass http://192.168.1.225:8090/;
		sub_filter 'href="/"' 'href="/ladder"';
		sub_filter_once off;
	}
	location = /ladder/ {
		return 301 /ladder;
	}

	location = /play {
		return 301 /play/;
	}
	location /play/ {
		proxy_pass http://192.168.1.225:8095/;
	}

	location = /sessions {
		return 301 /sessions/;
	}
	location /sessions/ {
		proxy_pass http://192.168.1.225:8096/;
	}

	location / {
		proxy_pass http://192.168.1.225:8090;
		sub_filter 'href="/"' 'href="/ladder"';
		sub_filter_once off;
	}
}
