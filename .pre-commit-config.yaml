repos:
  - repo: local
    hooks:
      - id: fix-guards
        name: Fix Header Guards
        entry: python3 scripts/fix_guards.py
        language: system
        types: [c++] # Looks for .cpp, .h, .inl etc
        files: \.(h|hpp|inl)$
      - id: clang-format
        name: Clang Format
        # No -style flag: the repo's .clang-format is the style, and passing
        # -style=google here silently ignored it.
        entry: clang-format -i
        language: system
        # .cc is what game_mcts/arena uses; leaving it out skipped all of it.
        files: \.(h|hpp|inl|cu|cc|cpp)$
      - id: jupyter-nb-clear-output
        name: jupyter-nb-clear-output
        files: \.ipynb$
        stages: [pre-commit]
        language: system
        entry: jupyter nbconvert --ClearOutputPreprocessor.enabled=True --inplace
