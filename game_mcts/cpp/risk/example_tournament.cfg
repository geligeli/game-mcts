# Example policy config for //game_mcts/cpp/risk:risk_tournament.
# Iterations are kept modest so a smoke run with --games_per_pair=2 finishes
# in a few minutes (full Risk games run thousands of move steps).

[policy]
name = baseline
type = mcts
iterations = 100
rollout = shortcut

[policy]
name = deep
type = mcts
iterations = 400
rollout = shortcut

[policy]
name = wide
type = mcts
iterations = 100
widening_c = 4.0
widening_alpha = 0.25
rollout = shortcut

[policy]
name = rng
type = random
